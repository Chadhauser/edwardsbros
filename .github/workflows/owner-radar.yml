name: Owner Radar

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:
  push:
    paths:
      - 'ops/owner_radar.py'
      - '.github/workflows/owner-radar.yml'

permissions:
  issues: write
  contents: read

concurrency:
  group: owner-radar
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
        run: python ops/owner_radar.py
