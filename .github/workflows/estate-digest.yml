name: Estate Monday Digest

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'ops/**'
      - '.github/workflows/estate-digest.yml'

permissions:
  issues: write
  contents: read

concurrency:
  group: estate-digest
  cancel-in-progress: true

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Build and post digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
        run: python ops/estate_digest.py
